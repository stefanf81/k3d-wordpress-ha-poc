apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: wordpress-poc
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      serviceAccountName: mariadb-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        workload: infra
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:12.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mariadb-root
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: wordpress-database
                  key: WORDPRESS_DB_NAME
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-database
                  key: WORDPRESS_DB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-database
                  key: WORDPRESS_DB_PASSWORD
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          # Startup and readiness run an authenticated query with the
          # WordPress account, so a credential problem makes MariaDB NotReady
          # instead of triggering restarts.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  mariadb
                  --protocol=tcp
                  --host=127.0.0.1
                  --user="$MARIADB_USER"
                  --password="$MARIADB_PASSWORD"
                  "$MARIADB_DATABASE"
                  --execute='SELECT 1'
                  >/dev/null
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  mariadb
                  --protocol=tcp
                  --host=127.0.0.1
                  --user="$MARIADB_USER"
                  --password="$MARIADB_PASSWORD"
                  "$MARIADB_DATABASE"
                  --execute='SELECT 1'
                  >/dev/null
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          # Liveness stays local (Unix socket present and PID 1 alive). A TCP
          # probe would log an "Aborted connection ... unauthenticated" line
          # every period.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -S /run/mysqld/mysqld.sock && kill -0 1
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: wordpress-poc
spec:
  type: ClusterIP
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
