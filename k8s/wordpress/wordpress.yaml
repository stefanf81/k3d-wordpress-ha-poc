apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress-poc
spec:
  replicas: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      serviceAccountName: wordpress-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        workload: wordpress
      # One replica per worker: with three replicas and three workers,
      # maxSkew 1 plus minDomains 3 forces a 1/1/1 placement.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: wordpress
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-wordpress-files
          image: wordpress:php8.5-apache
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /config/init-shared-files.sh
          volumeMounts:
            - name: wordpress-shared
              mountPath: /shared
            - name: wordpress-config
              mountPath: /config
              readOnly: true
      containers:
        - name: wordpress
          image: wordpress:php8.5-apache
          imagePullPolicy: IfNotPresent
          # The image entrypoint would generate its own wp-config.php; the
          # init container already installed ours, so start Apache directly.
          # ServerName silences AH00558 (pod IPs are not stable FQDNs).
          command:
            - /bin/sh
            - -ec
            - |
              printf 'ServerName localhost\n' > /etc/apache2/conf-available/servername.conf
              a2enconf servername >/dev/null
              exec apache2-foreground
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: wordpress-database
            - secretRef:
                name: wordpress-keys
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 60
          # /healthz.php checks PHP, the database connection and the WordPress
          # schema without triggering WordPress's canonical redirect to :8080.
          readinessProbe:
            httpGet:
              path: /healthz.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # A database outage makes replicas NotReady rather than restarting
          # every web container.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: wordpress-shared
              mountPath: /var/www/html
      volumes:
        - name: wordpress-shared
          persistentVolumeClaim:
            claimName: wordpress-shared
        - name: wordpress-config
          configMap:
            name: wordpress-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wordpress
  namespace: wordpress-poc
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: wordpress
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress-poc
spec:
  type: ClusterIP
  selector:
    app: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: wordpress-poc
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
---
# DISABLE_WP_CRON stops every web replica from running WP-Cron on page loads;
# this CronJob triggers it centrally instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wordpress-cron
  namespace: wordpress-poc
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 420
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: wordpress-cron
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: wp-cron
              image: curlimages/curl:8.16.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/wp-cron.sh
              # The image's USER is a name, which runAsNonRoot cannot verify,
              # so run as an explicit unprivileged uid.
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: wordpress-cron
