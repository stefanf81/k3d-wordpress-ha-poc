# Disposable PoC credentials. k3s encrypts Secrets at rest in this lab, but
# these values are committed to Git: never reuse them outside this lab.
#
# Keys are the environment variable names the pods read, so workloads load
# whole Secrets with envFrom. Each workload gets only the Secrets it needs.

# Database connection settings: WordPress, WP-CLI Jobs and MariaDB.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-database
  namespace: wordpress-poc
type: Opaque
stringData:
  WORDPRESS_DB_HOST: mariadb:3306
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress-poc-password
---
# All web replicas and WP-CLI must share the same auth keys and salts.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-keys
  namespace: wordpress-poc
type: Opaque
stringData:
  WORDPRESS_AUTH_KEY: poc-auth-key-change-me-01
  WORDPRESS_SECURE_AUTH_KEY: poc-secure-auth-key-change-me-02
  WORDPRESS_LOGGED_IN_KEY: poc-logged-in-key-change-me-03
  WORDPRESS_NONCE_KEY: poc-nonce-key-change-me-04
  WORDPRESS_AUTH_SALT: poc-auth-salt-change-me-05
  WORDPRESS_SECURE_AUTH_SALT: poc-secure-auth-salt-change-me-06
  WORDPRESS_LOGGED_IN_SALT: poc-logged-in-salt-change-me-07
  WORDPRESS_NONCE_SALT: poc-nonce-salt-change-me-08
---
# Only the bootstrap Job needs the administrator password.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  namespace: wordpress-poc
type: Opaque
stringData:
  ADMIN_PASSWORD: admin-poc-change-me
---
# Only MariaDB needs the root password (the migration helper reads it from
# inside the MariaDB container).
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-root
  namespace: wordpress-poc
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: wordpress-poc-root-password
