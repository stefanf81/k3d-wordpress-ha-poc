apiVersion: v1
kind: Namespace
metadata:
  name: wordpress-poc
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# k3d-specific shared filesystem:
# /var/lib/wordpress-shared is the SAME host directory bind-mounted into all
# three k3d agent containers. This makes the hostPath effectively shared for
# this local PoC. Do not copy this storage pattern to a real multi-machine cluster.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-shared
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/wordpress-shared
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-shared
  namespace: wordpress-poc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: wordpress-shared
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/mariadb-data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values:
                - infra
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: wordpress-poc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: mariadb-data
  resources:
    requests:
      storage: 5Gi
