apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wordpress-poc

resources:
  - ../secrets
  - mariadb.yaml

generatorOptions:
  labels:
    k3d-wordpress-ha-poc/generated: "true"

configMapGenerator:
  # Hash-named, so editing the script and re-running ./start.sh restarts
  # MariaDB with it.
  - name: mariadb-scripts
    files:
      - reconcile-credentials.sh
