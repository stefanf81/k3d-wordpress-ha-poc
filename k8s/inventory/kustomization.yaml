apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wordpress-poc

resources:
  - ../wp-config
  - job.yaml

configMapGenerator:
  # The Job is recreated on every run, so a stable name is enough.
  - name: wordpress-inventory
    files:
      - inventory.sh
    options:
      disableNameSuffixHash: true
