apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wordpress-poc

# Disposable PoC credentials. k3s encrypts Secrets at rest in this lab, but
# these values are committed to Git: never reuse them outside this lab.
#
# Keys are the environment variable names the pods read, so workloads load
# whole Secrets with envFrom. Each workload references only the Secrets it
# needs. Like k8s/wp-config, every kustomization that runs a consumer lists
# this directory as a resource, so they all build the same Secrets.
#
# The generated names carry a content hash: editing a value and re-running
# ./start.sh restarts MariaDB and WordPress with it. MariaDB's init container
# then changes the database accounts to match, and the bootstrap updates the
# administrator.
generatorOptions:
  labels:
    k3d-wordpress-ha-poc/generated: "true"

secretGenerator:
  # Database connection settings: WordPress, WP-CLI Jobs and MariaDB.
  - name: wordpress-database
    envs:
      - database.env
  # All web replicas and WP-CLI must share the same auth keys and salts.
  - name: wordpress-keys
    envs:
      - keys.env
  # Only the bootstrap Job needs the administrator password.
  - name: wordpress-admin
    envs:
      - admin.env
  # Only MariaDB needs the root password (the migration helper reads it from
  # inside the MariaDB container).
  - name: mariadb-root
    envs:
      - mariadb-root.env
