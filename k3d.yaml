apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: wordpress-ha-poc

# One Kubernetes control-plane node and three worker nodes.
servers: 1
agents: 3

# start.sh exports these variables (defaults live in lib.sh); k3d expands
# them. Override K3S_IMAGE to test a different k3s release without editing
# this file. SITE_PORT comes from SITE_URL in k8s/bootstrap/site.env.
image: ${K3S_IMAGE}

# Only reachable from this machine: the lab ships known admin credentials and
# deliberately old plugin versions, so never publish it on the LAN.
kubeAPI:
  hostIP: "127.0.0.1"

# SITE_URL (localhost) -> k3d load balancer -> Traefik.
ports:
  - port: 127.0.0.1:${SITE_PORT}:80
    nodeFilters:
      - loadbalancer

# Both stores are Docker named volumes, so they live on Docker's Linux
# filesystem rather than a macOS/Windows host file share. That keeps MariaDB's
# case-sensitive table names and gives the WordPress init containers working
# flock(1) locks and uid/gid ownership. All three workers mount the same
# WordPress volume, which is how the replicas share one tree.
volumes:
  - volume: ${WORDPRESS_SHARED_VOLUME}:/var/lib/wordpress-shared
    nodeFilters:
      - agent:*
  - volume: ${MARIADB_DATA_VOLUME}:/var/lib/mariadb-data
    nodeFilters:
      - server:0

options:
  k3d:
    wait: true
    timeout: "180s"

  k3s:
    # Encrypt Kubernetes Secret values at rest inside the local k3s datastore.
    extraArgs:
      - arg: --secrets-encryption
        nodeFilters:
          - server:*

    nodeLabels:
      - label: workload=wordpress
        nodeFilters:
          - agent:*
      - label: workload=infra
        nodeFilters:
          - server:*

  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
